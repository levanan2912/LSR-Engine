<title>Admin Console – StudySignal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f172a;--sidebar:#1e293b;--border:#334155;
  --text:#f1f5f9;--muted:#94a3b8;--primary:#6366f1;
  --success:#10b981;--warn:#f59e0b;--danger:#ef4444;
  --card:#1e293b;--card2:#263348;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit}
input,select{font-family:inherit}

/* ── Layout ── */
#sidebar{width:220px;min-height:100vh;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:50}
#main{margin-left:220px;flex:1;min-height:100vh;display:flex;flex-direction:column}
#topbar{height:52px;background:rgba(30,41,59,0.95);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:40;backdrop-filter:blur(8px)}
#content{padding:24px;flex:1}

/* ── Sidebar ── */
.sb-logo{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
.sb-logo h2{font-size:14px;font-weight:700;color:var(--primary);letter-spacing:.5px}
.sb-logo p{font-size:11px;color:var(--muted);margin-top:2px}
.sb-nav{padding:12px 8px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(99,102,241,.1);color:var(--text)}
.nav-item.active{background:rgba(99,102,241,.18);color:var(--primary)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.sb-footer{padding:14px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.sb-user{font-weight:600;color:var(--text);margin-bottom:2px;font-size:12px}
.sb-role{display:inline-flex;align-items:center;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;background:rgba(99,102,241,.2);color:var(--primary)}

/* ── Cards ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.stat-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.stat-val{font-size:28px;font-weight:700;line-height:1}
.stat-sub{font-size:11px;color:var(--muted);margin-top:5px}
.c-primary{color:var(--primary)} .c-success{color:var(--success)} .c-warn{color:var(--warn)} .c-danger{color:var(--danger)}

/* ── Section ── */
.section{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:20px;overflow:hidden}
.section-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.section-title{font-size:14px;font-weight:600}
.section-body{padding:16px 20px}

/* ── Table ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:9px 12px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid rgba(51,65,85,.5);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.email-cell{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap}
.badge-stable{background:rgba(16,185,129,.15);color:#10b981}
.badge-fluct{background:rgba(245,158,11,.15);color:#f59e0b}
.badge-high{background:rgba(239,68,68,.15);color:#ef4444}
.badge-active{background:rgba(16,185,129,.12);color:#10b981}
.badge-locked{background:rgba(239,68,68,.12);color:#ef4444}
.badge-deact{background:rgba(100,116,139,.15);color:#64748b}
.badge-noreport{background:rgba(245,158,11,.12);color:#f59e0b}
.badge-root{background:rgba(168,85,247,.15);color:#a855f7}
.badge-sub{background:rgba(99,102,241,.15);color:#818cf8}
.badge-user{background:rgba(100,116,139,.12);color:#94a3b8}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;border:none;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff} .btn-primary:hover{background:#4f46e5}
.btn-success{background:rgba(16,185,129,.15);color:var(--success);border:1px solid rgba(16,185,129,.3)} .btn-success:hover{background:rgba(16,185,129,.25)}
.btn-danger{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.25)} .btn-danger:hover{background:rgba(239,68,68,.22)}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--border)} .btn-ghost:hover{background:rgba(255,255,255,.1);color:var(--text)}
.btn-sm{padding:4px 10px;font-size:11px}

/* ── Filters ── */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filter-bar input,.filter-bar select{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:6px 11px;font-size:12px;outline:none}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--primary)}
.filter-bar input::placeholder{color:var(--muted)}
.quick-filters{display:flex;gap:6px}
.qf{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.qf:hover,.qf.active{background:rgba(99,102,241,.15);color:var(--primary);border-color:rgba(99,102,241,.4)}

/* ── Pagination ── */
.pagination{display:flex;align-items:center;gap:8px;margin-top:14px;justify-content:flex-end;font-size:12px;color:var(--muted)}
.pg-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:12px}
.pg-btn:hover:not(:disabled){background:rgba(255,255,255,.06);color:var(--text)}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}
.pg-info{padding:0 4px}

/* ── Charts ── */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.chart-title{font-size:13px;font-weight:600;margin-bottom:14px}
.chart-wrap{position:relative;height:200px}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#1e293b;border:1px solid var(--border);border-radius:14px;width:100%;max-width:520px;overflow:hidden}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-size:15px;font-weight:700}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.form-input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:8px 11px;font-size:13px;outline:none}
.form-input:focus{border-color:var(--primary)}

/* ── Toast ── */
#toast-container{position:fixed;top:18px;right:18px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;pointer-events:all;animation:slideIn .2s ease;max-width:320px}
.toast-success{background:#064e3b;border:1px solid #10b981;color:#6ee7b7}
.toast-error{background:#450a0a;border:1px solid #ef4444;color:#fca5a5}
.toast-info{background:#1e1b4b;border:1px solid #6366f1;color:#a5b4fc}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* ── Login screen ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;position:fixed;inset:0;background:var(--bg);z-index:100}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px;width:360px}
.login-card h1{font-size:20px;font-weight:700;margin-bottom:4px}
.login-card p{font-size:13px;color:var(--muted);margin-bottom:24px}

/* ── Loading ── */
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-row td{text-align:center;padding:32px;color:var(--muted)}
.empty-row td{text-align:center;padding:32px;color:var(--muted)}

/* ── Detail modal ── */
.detail-row{display:flex;gap:8px;margin-bottom:8px;font-size:12.5px}
.detail-key{color:var(--muted);min-width:130px;flex-shrink:0}
.detail-val{color:var(--text)}
.signal-list{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.signal-item{display:flex;gap:6px;font-size:12px}
.signal-item::before{content:"▸";color:var(--primary);flex-shrink:0}
.risk-section{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.risk-section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}

/* ── Timeline ── */
.tl-item{display:flex;gap:12px;margin-bottom:10px;align-items:flex-start;font-size:12px}
.tl-dot{width:10px;height:10px;border-radius:50%;margin-top:3px;flex-shrink:0}
.tl-date{color:var(--muted);min-width:80px}
.tl-info{flex:1}

/* ── Responsive ── */
@media(max-width:900px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .chart-grid{grid-template-columns:1fr}
}
@media(max-width:640px){
  #sidebar{display:none}
  #main{margin-left:0}
  .stat-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- Toast -->
<div id="toast-container"></div>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-card">
    <h1>🛡️ Admin Console</h1>
    <p>StudySignal – Khu vực quản trị</p>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input id="login-email" class="form-input" type="email" placeholder="admin@gmail.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label class="form-label">Mật khẩu</label>
      <input id="login-pass" class="form-input" type="password" placeholder="password" autocomplete="current-password"/>
    </div>
    <div id="login-err" style="color:var(--danger);font-size:12px;margin-bottom:12px;display:none"></div>
    <button id="login-btn" class="btn btn-primary" style="width:100%;justify-content:center;padding:10px" onclick="doLogin()">
      Đăng nhập
    </button>
  </div>
</div>

<!-- App Shell (hidden until logged in) -->
<div id="app-shell" style="display:none;width:100%">

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sb-logo">
      <h2>📡 LSR Admin</h2>
      <p>StudySignal Console</p>
    </div>
    <nav class="sb-nav">
      <button class="nav-item active" onclick="navigate('dashboard')" data-page="dashboard">
        <span class="nav-icon">📊</span> Dashboard
      </button>
      <button class="nav-item" onclick="navigate('users')" data-page="users">
        <span class="nav-icon">👥</span> Người dùng
      </button>
      <button class="nav-item" onclick="navigate('entries')" data-page="entries">
        <span class="nav-icon">📋</span> Phiên học
      </button>
      <button class="nav-item" onclick="navigate('reports')" data-page="reports">
        <span class="nav-icon">🤖</span> Báo cáo AI
      </button>
      <button class="nav-item" onclick="navigate('apikeys')" data-page="apikeys">
        <span class="nav-icon">🔑</span> API Keys
      </button>
      <button class="nav-item" onclick="navigate('forummod')" data-page="forummod">
        <span class="nav-icon">📝</span> Duyệt bài viết
        <span id="sb-pending-badge" style="display:none;margin-left:auto;background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px">0</span>
      </button>
    </nav>
    <div class="sb-footer">
      <div class="sb-user" id="sb-user-name">–</div>
      <div style="margin:4px 0"><span class="sb-role" id="sb-user-role">–</span></div>
      <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="doLogout()">Đăng xuất</button>
    </div>
  </div>

  <!-- Main -->
  <div id="main">
    <div id="topbar">
      <div style="font-size:14px;font-weight:600" id="topbar-title">Dashboard</div>
      <div style="font-size:12px;color:var(--muted)" id="topbar-sub">StudySignal Admin Console</div>
    </div>
    <div id="content">
      <!-- Pages injected here -->
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div id="confirm-modal" class="overlay" style="display:none">
  <div class="modal" style="max-width:400px">
    <div class="modal-head">
      <span class="modal-title" id="confirm-title">Xác nhận</span>
      <button class="modal-close" onclick="closeConfirm()">×</button>
    </div>
    <div class="modal-body">
      <p id="confirm-msg" style="font-size:13px;margin-bottom:14px"></p>
      <div id="confirm-reason-wrap" class="form-group" style="display:none">
        <label class="form-label">Lý do (tùy chọn)</label>
        <textarea id="confirm-reason" class="form-input" rows="2" style="resize:vertical" placeholder="Nhập lý do..."></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeConfirm()">Hủy</button>
      <button class="btn" id="confirm-ok-btn" onclick="confirmOk()">Xác nhận</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div id="detail-modal" class="overlay" style="display:none">
  <div class="modal" style="max-width:600px">
    <div class="modal-head">
      <span class="modal-title" id="detail-title">Chi tiết</span>
      <button class="modal-close" onclick="document.getElementById('detail-modal').style.display='none'">×</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════════
let TOKEN = localStorage.getItem('lsr_admin_token') || ''
let ADMIN = JSON.parse(localStorage.getItem('lsr_admin_user') || 'null')
let currentPage = 'dashboard'
let confirmCallback = null

// ═══════════════════════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════════════════════
function toast(msg, type='info') {
  const el = document.createElement('div')
  el.className = `toast toast-${type}`
  el.textContent = msg
  document.getElementById('toast-container').appendChild(el)
  setTimeout(() => el.remove(), 3500)
}

async function api(path, opts={}) {
  const res = await fetch('/api/admin' + path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json', ...(opts.headers||{}) },
  })
  const data = await res.json()
  if (!res.ok) throw new Error(data.message || 'Lỗi server')
  return data
}

function fmtDate(d) {
  if (!d) return '–'
  return d.substring(0,10)
}
// Báo cáo AI được tạo ra dựa trên phiên hiện tại phân tích lịch sử trước đó
// → hiển thị "1 phiên trước đó" thay vì số âm hoặc 0
function fmtReportSession(n) {
  const prev = (n || 1) - 1
  if (prev <= 0) return 'Phiên trước'
  return 'P' + prev
}
function fmtDateTime(d) {
  if (!d) return '–'
  return d.replace('T',' ').substring(0,16)
}
function riskBadge(r) {
  if (!r) return '<span class="badge badge-noreport">Chưa có</span>'
  if (r==='Stable') return '<span class="badge badge-stable">Ổn định</span>'
  if (r==='Fluctuating') return '<span class="badge badge-fluct">Dao động</span>'
  if (r==='High Risk') return '<span class="badge badge-high">Rủi ro cao</span>'
  return `<span class="badge">${r}</span>`
}
function statusBadge(isActive) {
  return isActive ? '<span class="badge badge-active">Hoạt động</span>' : '<span class="badge badge-deact">Deactivated</span>'
}
function lockBadge(locked) {
  return locked ? '<span class="badge badge-locked">🔒 Bị khóa</span>' : '<span class="badge badge-active">✓ Bình thường</span>'
}
function roleBadge(role) {
  if (role==='rootadmin') return '<span class="badge badge-root">rootadmin</span>'
  if (role==='subadmin')  return '<span class="badge badge-sub">subadmin</span>'
  return '<span class="badge badge-user">user</span>'
}

// ═══════════════════════════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════════════════════════
async function doLogin() {
  const email = document.getElementById('login-email').value.trim()
  const pass  = document.getElementById('login-pass').value
  const errEl = document.getElementById('login-err')
  const btn   = document.getElementById('login-btn')
  errEl.style.display = 'none'
  if (!email || !pass) { errEl.textContent='Vui lòng điền đầy đủ'; errEl.style.display='block'; return }
  btn.disabled = true
  btn.innerHTML = '<span class="spinner"></span> Đang đăng nhập...'
  try {
    const res = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, password: pass })
    })
    const data = await res.json()
    if (!res.ok) { throw new Error(data.message || 'Sai thông tin đăng nhập') }
    if (!['rootadmin','subadmin'].includes(data.user?.role)) {
      throw new Error('Bạn không có quyền truy cập khu vực quản trị')
    }
    TOKEN = data.token
    ADMIN = data.user
    localStorage.setItem('lsr_admin_token', TOKEN)
    localStorage.setItem('lsr_admin_user', JSON.stringify(ADMIN))
    initApp()
  } catch(e) {
    errEl.textContent = e.message
    errEl.style.display = 'block'
  } finally {
    btn.disabled = false
    btn.textContent = 'Đăng nhập'
  }
}

document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin() })
document.getElementById('login-email').addEventListener('keydown', e => { if(e.key==='Enter') doLogin() })

function doLogout() {
  TOKEN = ''; ADMIN = null
  localStorage.removeItem('lsr_admin_token')
  localStorage.removeItem('lsr_admin_user')
  // Clear password input every time login screen is shown
  document.getElementById('login-pass').value = ''
  document.getElementById('login-err').style.display = 'none'
  document.getElementById('login-screen').style.display = 'flex'
  document.getElementById('app-shell').style.display = 'none'
}

function initApp() {
  document.getElementById('login-screen').style.display = 'none'
  document.getElementById('app-shell').style.display = 'block'
  document.getElementById('sb-user-name').textContent = ADMIN?.full_name || ADMIN?.email || '–'
  document.getElementById('sb-user-role').textContent = ADMIN?.role || '–'
  navigate('dashboard')
  // Show pending count badge after login
  setTimeout(loadFmSidebarBadge, 1000)
}

// ═══════════════════════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════════════════════
function navigate(page) {
  currentPage = page
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.page === page))
  const titles = { dashboard:'Dashboard', users:'Quản lý Người dùng', entries:'Quản lý Phiên học', reports:'Báo cáo AI', apikeys:'API Keys', forummod:'Duyệt bài viết Diễn đàn' }
  document.getElementById('topbar-title').textContent = titles[page] || page
  const pages = { dashboard: renderDashboard, users: renderUsers, entries: renderEntries, reports: renderReports, apikeys: renderApiKeys, forummod: renderForumMod }
  if (pages[page]) pages[page]()
}

// ═══════════════════════════════════════════════════════════════════════════════
// CONFIRM MODAL
// ═══════════════════════════════════════════════════════════════════════════════
function openConfirm(title, msg, cb, showReason=false, btnClass='btn-danger') {
  document.getElementById('confirm-title').textContent = title
  document.getElementById('confirm-msg').textContent = msg
  document.getElementById('confirm-reason-wrap').style.display = showReason ? 'block' : 'none'
  document.getElementById('confirm-reason').value = ''
  const okBtn = document.getElementById('confirm-ok-btn')
  okBtn.className = 'btn ' + btnClass
  okBtn.textContent = 'Xác nhận'
  confirmCallback = cb
  document.getElementById('confirm-modal').style.display = 'flex'
}
function closeConfirm() { document.getElementById('confirm-modal').style.display = 'none'; confirmCallback = null }
function confirmOk() {
  const reason = document.getElementById('confirm-reason').value.trim()
  const cb = confirmCallback   // capture BEFORE closeConfirm nulls it
  closeConfirm()
  if (cb) cb(reason)
}

let dashState = { from:'', to:'', timelineUserId:'' }

async function loadDashStats() {
  const from = document.getElementById('dash-from')?.value || dashState.from
  const to   = document.getElementById('dash-to')?.value   || dashState.to
  dashState.from = from; dashState.to = to

  try {
    const d = await api(`/stats?from=${from}&to=${to}`)
    document.getElementById('dash-stats').innerHTML = `
      <div class="stat-card">
        <div class="stat-label">Tổng người dùng</div>
        <div class="stat-val c-primary">${d.total_users}</div>
        <div class="stat-sub">tài khoản user</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Người dùng mới</div>
        <div class="stat-val c-success">${d.new_users_count}</div>
        <div class="stat-sub">${from} → ${to}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Người dùng hoạt động</div>
        <div class="stat-val c-warn">${d.active_users_count}</div>
        <div class="stat-sub">có phiên học trong kỳ</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">High Risk</div>
        <div class="stat-val c-danger">${d.high_risk_count}</div>
        <div class="stat-sub">người dùng cần chú ý</div>
      </div>
    `

    // Destroy old charts
    Object.values(dashCharts).forEach(c => c.destroy())
    dashCharts = {}

    // Users chart
    const uc = document.getElementById('chart-users')
    if (uc) {
      dashCharts.users = new Chart(uc, {
        type:'line',
        data:{
          labels: d.daily_new_users.map(r=>r.date.substring(5)),
          datasets:[{label:'Người dùng mới',data:d.daily_new_users.map(r=>r.count),
            borderColor:'#6366f1',backgroundColor:'rgba(99,102,241,.12)',fill:true,tension:.3,pointRadius:3}]
        },
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
          scales:{x:{ticks:{color:'#94a3b8',font:{size:10}},grid:{color:'rgba(255,255,255,.05)'}},
                  y:{ticks:{color:'#94a3b8',font:{size:10}},grid:{color:'rgba(255,255,255,.05)'},beginAtZero:true}}}
      })
    }

    // Risk pie
    const rc = document.getElementById('chart-risk')
    if (rc && d.risk_distribution.length) {
      const labelMap = {'Stable':'Ổn định','Fluctuating':'Dao động','High Risk':'Rủi ro cao'}
      const colorMap = {'Stable':'#10b981','Fluctuating':'#f59e0b','High Risk':'#ef4444'}
      dashCharts.risk = new Chart(rc, {
        type:'doughnut',
        data:{
          labels: d.risk_distribution.map(r=>labelMap[r.risk_level]||r.risk_level),
          datasets:[{data:d.risk_distribution.map(r=>r.count),
            backgroundColor:d.risk_distribution.map(r=>colorMap[r.risk_level]||'#94a3b8'),
            borderColor:'#1e293b',borderWidth:2}]
        },
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8',font:{size:11}}}}}
      })
    } else if (rc) {
      const ctx = rc.getContext('2d')
      ctx.fillStyle='#94a3b8'; ctx.font='13px Inter'; ctx.textAlign='center'
      ctx.fillText('Chưa có dữ liệu', rc.width/2, rc.height/2)
    }

    // Sessions bar
    const sc = document.getElementById('chart-sessions')
    if (sc) {
      dashCharts.sessions = new Chart(sc, {
        type:'bar',
        data:{
          labels:d.daily_sessions.map(r=>r.date.substring(5)),
          datasets:[{label:'Phiên học',data:d.daily_sessions.map(r=>r.count),
            backgroundColor:'rgba(16,185,129,.5)',borderColor:'#10b981',borderWidth:1,borderRadius:3}]
        },
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
          scales:{x:{ticks:{color:'#94a3b8',font:{size:10}},grid:{color:'rgba(255,255,255,.05)'}},
                  y:{ticks:{color:'#94a3b8',font:{size:10}},grid:{color:'rgba(255,255,255,.05)'},beginAtZero:true}}}
      })
    }
  } catch(e) { toast(e.message, 'error') }
}

function setDashRange(days) {
  const to  = new Date(Date.now()+7*3600000).toISOString().split('T')[0]
  const from= new Date(Date.now()+7*3600000-days*86400000).toISOString().split('T')[0]
  document.getElementById('dash-from').value = from
  document.getElementById('dash-to').value   = to
  dashState.from = from; dashState.to = to
  document.querySelectorAll('.qf').forEach(b=>b.classList.remove('active'))
  event.target.classList.add('active')
  loadDashStats()
}

async function loadTimeline() {
  const uid = document.getElementById('tl-user-id').value.trim()
  if (!uid) { toast('Nhập User ID','error'); return }
  const el = document.getElementById('timeline-content')
  el.innerHTML = '<span class="spinner"></span> Đang tải...'
  try {
    const d = await api(`/user-timeline/${uid}?from=${dashState.from}&to=${dashState.to}`)
    if (!d.timeline.length) { el.innerHTML='<span style="color:var(--muted)">Không có dữ liệu trong kỳ này.</span>'; return }
    const colorMap = {'Stable':'#10b981','Fluctuating':'#f59e0b','High Risk':'#ef4444'}
    el.innerHTML = `
      <div style="margin-bottom:12px;font-size:12px">
        <strong>${d.user.email}</strong> &nbsp;|&nbsp; ${d.user.full_name||'–'} &nbsp;|&nbsp; ${roleBadge(d.user.role)}
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${d.timeline.map(t=>`
          <div title="${t.session_date} P${t.session_number} – ${t.risk_level||'?'}" style="
            width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;
            font-size:10px;font-weight:700;cursor:default;
            background:${colorMap[t.risk_level]||'#334155'}22;
            border:1px solid ${colorMap[t.risk_level]||'#334155'};
            color:${colorMap[t.risk_level]||'#94a3b8'}
          ">${t.session_date.substring(5)}</div>
        `).join('')}
      </div>
      <div style="display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--muted)">
        <span style="color:#10b981">■ Ổn định</span>
        <span style="color:#f59e0b">■ Dao động</span>
        <span style="color:#ef4444">■ Rủi ro cao</span>
        <span style="color:#334155">■ Chưa có báo cáo</span>
      </div>
    `
  } catch(e) { el.innerHTML=`<span style="color:var(--danger)">${e.message}</span>` }
}

async function loadUsers() {
  const s = usersState
  try {
    const d = await api(`/users?page=${s.page}&limit=${s.limit}&search=${encodeURIComponent(s.search)}&filter=${s.filter}`)
    usersState.total = d.total; usersState.total_pages = d.total_pages
    document.getElementById('u-count').textContent = `${d.total} người dùng`
    const cols = ADMIN?.role==='rootadmin' ? 10 : 9
    const tbody = document.getElementById('u-tbody')
    if (!d.users.length) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="${cols}">Không có dữ liệu</td></tr>`
    } else {
      tbody.innerHTML = d.users.map(u => {
        // Show temp password only when must_change_password=1 (not yet changed)
        const tempPwDisplay = (u.must_change_password && u.temp_password)
          ? `<code style="font-size:11px;color:#f59e0b;background:rgba(245,158,11,.1);padding:2px 6px;border-radius:4px;border:1px solid rgba(245,158,11,.3);letter-spacing:1px">${u.temp_password}</code>`
          : '<span style="color:var(--muted)">–</span>'
        return `
        <tr>
          <td style="color:var(--muted);font-size:11px">#${u.id}</td>
          <td class="email-cell" title="${u.email}">${u.email}</td>
          <td>${u.full_name||'–'}</td>
          <td>${roleBadge(u.role)}</td>
          <td>${lockBadge(u.is_locked)}</td>
          <td style="text-align:center">${u.sessions_count||0}</td>
          <td>${fmtDate(u.last_active)}</td>
          <td>${fmtDate(u.created_at)}</td>
          <td>${tempPwDisplay}</td>
          ${ADMIN?.role==='rootadmin' ? `<td style="display:flex;gap:6px;flex-wrap:wrap">
            ${u.is_locked
              ? `<button class="btn btn-success btn-sm" onclick="unlockUser(${u.id},'${u.email}')">🔓 Mở khóa</button>`
              : `<button class="btn btn-danger btn-sm" onclick="lockUser(${u.id},'${u.email}')">🔒 Khóa</button>`
            }
            <button class="btn btn-ghost btn-sm" onclick="resetPassword(${u.id},'${u.email}','${(u.full_name||'').replace(/'/g,"\\'")}')">🔑 Reset MK</button>
          </td>` : ''}
        </tr>
      `}).join('')
    }
    renderPagination('u-pagination', s.page, s.total_pages, p=>{usersState.page=p;loadUsers()})
  } catch(e) { toast(e.message,'error') }
}

function lockUser(id, email) {
  openConfirm('Khóa tài khoản', `Bạn có chắc muốn khóa tài khoản "${email}"?`, async (reason)=>{
    try {
      await api(`/users/${id}/lock`, {method:'POST', body:JSON.stringify({reason})})
      toast('Đã khóa tài khoản', 'success'); loadUsers()
    } catch(e) { toast(e.message,'error') }
  }, true, 'btn-danger')
}

function unlockUser(id, email) {
  openConfirm('Mở khóa tài khoản', `Bạn có chắc muốn mở khóa tài khoản "${email}"?`, async ()=>{
    try {
      await api(`/users/${id}/unlock`, {method:'POST', body:JSON.stringify({})})
      toast('Đã mở khóa tài khoản', 'success'); loadUsers()
    } catch(e) { toast(e.message,'error') }
  }, false, 'btn-success')
}

// ── Reset password (rootadmin only) ──────────────────────────────────────────

    `Reset mật khẩu cho "${email}"? Mật khẩu tạm thời sẽ được tạo tự động.`,

async function loadEntries() {

  try {
    const d = await api(`/entries?page=${s.page}&limit=${s.limit}&user_email=${encodeURIComponent(s.search)}&filter=${s.filter}&from=${s.from}&to=${s.to}`)

    document.getElementById('e-count').textContent = `${d.total} phiên học`
    const tbody = document.getElementById('e-tbody')
    if (!d.entries.length) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="8">Không có dữ liệu</td></tr>'
    } else {
      tbody.innerHTML = d.entries.map(e => {
        const sd = e.session_date ? String(e.session_date).substring(0,10).replace(/-/g,'/') : '–'
        const sessionLabel = `${sd} - Phiên ${e.session_number||1}`
        return `
        <tr>
          <td style="white-space:nowrap;font-weight:500">${sessionLabel}</td>
          <td class="email-cell" title="${e.user_email}">${e.user_email}</td>
          <td>${(+e.study_hours||0).toFixed(1)}h</td>
          <td style="text-align:center">${e.focus_level||'–'}/5</td>
          <td style="text-align:center">${e.dropout_feeling||'–'}/5</td>
          <td>${riskBadge(e.risk_level)}</td>
          <td>${statusBadge(e.is_active)}</td>

let reportsState = { page:1, search:'', risk:'', from:'', to:'', total:0, total_pages:1, groupByUser:true }

function renderReports() {
  const today = new Date(Date.now()+7*3600000).toISOString().split('T')[0]
  const d30   = new Date(Date.now()+7*3600000-29*86400000).toISOString().split('T')[0]

  reportsState.to   = reportsState.to   || today

  document.getElementById('content').innerHTML = `

      <input type="date" id="r-to" value="${reportsState.to}" onchange="reportsState.to=this.value"

      <div class="section-head">
        <span class="section-title">🤖 Danh sách báo cáo AI</span>
        <span id="r-count" style="font-size:12px;color:var(--muted)"></span>
      </div>

          <thead><tr>
            <th>ID</th><th>Ngày báo cáo</th><th>Phiên</th>

          </tr></thead>
          <tbody id="r-tbody"><tr class="loading-row"><td colspan="6"><span class="spinner"></span></td></tr></tbody>
        </table>
      </div>

      </div>

async function loadReports() {
  const s = reportsState
  try {
    const d = await api(`/reports?page=${s.page}&limit=12&user_email=${encodeURIComponent(s.search)}&risk_level=${encodeURIComponent(s.risk)}&from=${s.from}&to=${s.to}`)
    reportsState.total = d.total; reportsState.total_pages = d.total_pages
    document.getElementById('r-count').textContent = `${d.total} báo cáo`
    const tbody = document.getElementById('r-tbody')
    if (!d.reports.length) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="6">Không có dữ liệu</td></tr>'
    } else if (s.groupByUser) {
      // Group reports by user — thead: ID | Ngày báo cáo | Phiên | Rủi ro | Vấn đề cốt lõi | Chi tiết (6 cols)
      const grouped = {}
      d.reports.forEach(r => {
        const key = r.user_email
        if (!grouped[key]) grouped[key] = { email: r.user_email, reports: [] }
        grouped[key].reports.push(r)
        window['_report_'+r.id] = r
      })
      const rows = []
      Object.values(grouped).forEach(g => {
        rows.push(`<tr style="background:rgba(99,102,241,0.08)">
          <td colspan="6" style="padding:8px 12px">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <span style="font-weight:700;font-size:13px;color:var(--primary)">${g.email}</span>
              <span style="font-size:11px;color:var(--muted)">${g.reports.length} báo cáo</span>
            </div>
          </td>
        </tr>`)
        g.reports.forEach(r => {
          const driver = r.primary_risk_driver ? String(r.primary_risk_driver).substring(0,55)+(String(r.primary_risk_driver).length>55?'…':'') : '–'
          rows.push(`<tr>
            <td style="color:var(--muted);font-size:11px;padding-left:24px">#${r.id}</td>
            <td>${fmtDate(r.report_date)}</td>
            <td style="text-align:center">${fmtReportSession(r.session_number)}</td>
            <td>${riskBadge(r.risk_level)}</td>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px" title="${r.primary_risk_driver||''}">${driver}</td>
            <td><button class="btn btn-ghost btn-sm" onclick="showReportDetail(${r.id})">Xem chi tiết</button></td>
          </tr>`)
        })
      })
      tbody.innerHTML = rows.join('')
    } else {
      tbody.innerHTML = d.reports.map(r => {
        const driver = r.primary_risk_driver ? String(r.primary_risk_driver).substring(0,60)+(String(r.primary_risk_driver).length>60?'…':'') : '–'
        window['_report_'+r.id] = r
        return `
          <tr>
            <td style="color:var(--muted);font-size:11px">#${r.id}</td>
            <td>${fmtDate(r.report_date)}</td>
            <td style="text-align:center">${fmtReportSession(r.session_number)}</td>
            <td>${riskBadge(r.risk_level)}</td>
            <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px" title="${r.primary_risk_driver||''}">${driver}</td>
            <td><button class="btn btn-ghost btn-sm" onclick="showReportDetail(${r.id})">Xem chi tiết</button></td>
          </tr>
        `
      }).join('')
    }
    renderPagination('r-pagination', s.page, s.total_pages, p=>{reportsState.page=p;loadReports()})
  } catch(e) { toast(e.message,'error') }
}

// ─── STATS TAB ─────────────────────────────────────────────────────────────────
async function loadApiKeys() {
  const el = document.getElementById('apikeys-content')
  if (!el) return
  el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--muted)"><span class="spinner"></span> Đang tải...</div>`
  try {
    const [statsData, cfgData] = await Promise.all([
      api('/model-stats'),
      api('/model-config'),
    ])
    const today = new Date(Date.now()+7*3600000).toISOString().split('T')[0]
    const stats = statsData.stats || {}

    // Build ordered model list from DB config (reflects admin priority settings)
    const cfgModels = (cfgData.models || [])
    const orderedModels = cfgModels.length
      ? cfgModels.map(m => m.model_name)
      : Object.keys(MODEL_LABELS)

    // Luôn hiển thị đủ 5 key columns (KEY_NAMES), thêm key lạ nếu có
    const keySet = new Set()
    Object.values(stats).forEach(byKey => Object.keys(byKey).forEach(k => keySet.add(k)))
    // KEY_NAMES luôn xuất hiện, key ngoài danh sách thêm vào cuối
    const allKeys = [...KEY_NAMES, ...[...keySet].filter(k => !KEY_NAMES.includes(k))]

    // Build per-model limit map from DB config
    const dbLimits = {}
    const dbLabels = {}
    cfgModels.forEach(m => {
      dbLimits[m.model_name] = m.daily_limit
      dbLabels[m.model_name] = m.display_name
    })
    const getLbl   = m => dbLabels[m] || MODEL_LABELS[m] || m
    const getLimit = m => dbLimits[m] != null ? dbLimits[m] : (MODEL_LIMITS[m] != null ? MODEL_LIMITS[m] : null)

    // Tính tổng usage hôm nay để quyết định hiển thị hay empty state
    const totalUsageToday = Object.values(stats).reduce((s, byKey) =>
      s + Object.values(byKey).reduce((a, b) => a + b, 0), 0)

    let html = `<div style="font-size:12px;color:var(--muted);margin-bottom:16px">📅 Số lượt sử dụng hôm nay: <strong style="color:var(--text)">${today}</strong> &nbsp;·&nbsp; Làm mới theo ngày lúc 00:00 GMT+7</div>`

    if (!orderedModels.length) {
      html += `<div class="section"><div class="section-body" style="text-align:center;padding:32px;color:var(--muted)">Chưa có dữ liệu sử dụng hôm nay</div></div>`
    } else {
      html += `
        <div class="section">
          <div class="section-head"><span class="section-title">📊 Lượt dùng theo Model × API Key</span>
            <span style="font-size:11px;color:var(--muted);margin-left:8px">(thứ tự = độ ưu tiên hiện tại)</span>
          </div>
          <div class="tbl-wrap"><table>
            <thead><tr>
              <th style="width:30px">#</th>
              <th>Model</th>
              <th>Giới hạn/ngày</th>
              ${allKeys.map(k=>`<th style="text-align:center">${k}</th>`).join('')}
              <th style="text-align:center">Tổng</th>
            </tr></thead><tbody>`

      orderedModels.forEach((model, idx) => {
        const byKey = stats[model] || {}
        const limit = getLimit(model)
        let rowTotal = 0
        const cells = allKeys.map(k => {
          const cnt = byKey[k] || 0
          rowTotal += cnt
          const pct = (limit && limit > 0) ? cnt/limit : 0
          const color = pct >= 1 ? 'var(--danger)' : pct >= 0.7 ? 'var(--warn)' : (cnt > 0 ? 'var(--success)' : 'var(--muted)')
          const display = limit ? `${cnt}/${limit}` : `${cnt}`
          return `<td style="text-align:center;font-weight:600;color:${color}">${display}</td>`
        }).join('')
        const totalColor = rowTotal > 0 ? 'var(--primary)' : 'var(--muted)'
        const cfgRow = cfgModels.find(m => m.model_name === model)
        const isEnabled = !cfgRow || cfgRow.enabled === 1
        html += `<tr style="${!isEnabled ? 'opacity:0.45' : ''}">
          <td style="text-align:center;color:var(--muted);font-size:11px">${idx+1}</td>
          <td style="font-weight:600">${getLbl(model)} ${!isEnabled ? '<span style="font-size:10px;color:var(--danger)">[tắt]</span>' : ''}</td>
          <td style="color:var(--muted)">${limit != null ? limit+'/ngày' : '–'}</td>
          ${cells}
          <td style="text-align:center;font-weight:700;color:${totalColor}">${rowTotal}</td>
        </tr>`
      })

      html += `</tbody></table></div></div>`

      // Per-key cards
      html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:20px">`
      allKeys.forEach(keyName => {
        let keyTotal = 0
        const modelRows = orderedModels.map(model => {
          const cnt = (stats[model]||{})[keyName] || 0
          keyTotal += cnt
          if (!cnt) return ''
          const limit = getLimit(model)
          const pct = (limit && limit > 0) ? cnt/limit : 0
          const color = pct >= 1 ? 'var(--danger)' : pct >= 0.7 ? 'var(--warn)' : 'var(--success)'
          return `<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px">
            <span style="color:var(--muted)">${getLbl(model)}</span>
            <span style="font-weight:700;color:${color}">${cnt}${limit?'/'+limit:''}</span>
          </div>`
        }).join('')
        html += `<div class="stat-card">
          <div class="stat-label">🔑 ${keyName}</div>
          <div class="stat-val c-primary" style="font-size:22px;margin-bottom:10px">${keyTotal} <span style="font-size:13px;color:var(--muted);font-weight:400">lượt</span></div>
          ${modelRows || '<div style="font-size:11px;color:var(--muted)">Chưa dùng hôm nay</div>'}
        </div>`
      })
      html += `</div>`
    }
    el.innerHTML = html
  } catch(e) {
    el.innerHTML = `<div class="section"><div class="section-body" style="color:var(--danger);padding:20px">${e.message}</div></div>`
  }
}

// ─── Drag-and-drop logic ────────────────────────────────────────────────────────
let _mcDragSrcId = null

function mcDragStart(e) {
  const row = e.currentTarget
  _mcDragSrcId = parseInt(row.dataset.id)
  row.classList.add('dragging')
  e.dataTransfer.effectAllowed = 'move'
}
function mcDragOver(e) {
  e.preventDefault()
  e.dataTransfer.dropEffect = 'move'
  document.querySelectorAll('.model-cfg-row').forEach(r => r.classList.remove('drag-over'))
  e.currentTarget.classList.add('drag-over')
}
function mcDrop(e) {
  e.preventDefault()
  const targetId = parseInt(e.currentTarget.dataset.id)
  if (_mcDragSrcId === null || _mcDragSrcId === targetId) return

  // Reorder _modelConfigRows by swapping positions
  const srcIdx = _modelConfigRows.findIndex(m => m.id === _mcDragSrcId)
  const tgtIdx = _modelConfigRows.findIndex(m => m.id === targetId)
  if (srcIdx < 0 || tgtIdx < 0) return

  const sorted = [..._modelConfigRows].sort((a,b) => a.sort_order - b.sort_order)
  const srcItem = sorted.splice(sorted.findIndex(m => m.id === _mcDragSrcId), 1)[0]
  const newTgtIdx = sorted.findIndex(m => m.id === targetId)
  sorted.splice(newTgtIdx, 0, srcItem)

  // Re-assign sort_order sequentially
  sorted.forEach((m, i) => { m.sort_order = i + 1 })
  _modelConfigRows = sorted
  renderModelConfigEditor()
}
function mcDragEnd(e) {
  document.querySelectorAll('.model-cfg-row').forEach(r => r.classList.remove('dragging','drag-over'))
  _mcDragSrcId = null
}

// ─── Sync sort_order from number inputs ────────────────────────────────────────
function mcSyncFromInputs() {
  document.querySelectorAll('.mc-order').forEach(inp => {
    const id = parseInt(inp.dataset.id)
    const row = _modelConfigRows.find(m => m.id === id)
    if (row) row.sort_order = parseInt(inp.value) || row.sort_order
  })
  // Re-sort and re-render to update badges
  _modelConfigRows.sort((a,b) => a.sort_order - b.sort_order)
  // Re-assign clean sequential orders
  _modelConfigRows.forEach((m, i) => { m.sort_order = i + 1 })
  renderModelConfigEditor()
}

function mcToggleEnabled(chk) {
  const id = parseInt(chk.dataset.id)
  const row = _modelConfigRows.find(m => m.id === id)
  if (row) row.enabled = chk.checked ? 1 : 0
  // Update row opacity live
  const rowEl = chk.closest('.model-cfg-row')
  if (rowEl) rowEl.style.opacity = chk.checked ? '1' : '0.5'
}

// ─── Save ──────────────────────────────────────────────────────────────────────
async function saveModelConfig() {
  const statusEl = document.getElementById('mc-status')

  // Collect latest values from inputs
  const payload = _modelConfigRows.map(m => {
    const timeoutInput = document.querySelector(`.mc-timeout[data-id="${m.id}"]`)
    const notesInput   = document.querySelector(`.mc-notes[data-id="${m.id}"]`)
    const enabledInput = document.querySelector(`.mc-enabled[data-id="${m.id}"]`)
    const orderInput   = document.querySelector(`.mc-order[data-id="${m.id}"]`)
    return {
      id:         m.id,
      sort_order: orderInput   ? parseInt(orderInput.value)   : m.sort_order,
      enabled:    enabledInput ? (enabledInput.checked ? 1 : 0) : m.enabled,
      timeout_ms: timeoutInput ? parseInt(timeoutInput.value) * 1000 : m.timeout_ms,
      notes:      notesInput   ? notesInput.value : (m.notes || ''),
    }
  })

  // Re-assign sequential sort_order from current row order
  payload.sort((a,b) => a.sort_order - b.sort_order)
  payload.forEach((p, i) => { p.sort_order = i + 1 })

  if (statusEl) statusEl.innerHTML = '<span class="spinner"></span> Đang lưu...'
  try {
    const d = await api('/model-config', { method:'PUT', body: JSON.stringify({ models: payload }) })
    if (!d.success) throw new Error(d.message || 'Lỗi lưu cấu hình')
    _modelConfigRows = d.models || _modelConfigRows
    if (statusEl) statusEl.innerHTML = `<span style="color:var(--success)">✅ Đã lưu lúc ${new Date().toLocaleTimeString('vi-VN')}</span>`
    renderModelConfigEditor()
  } catch(e) {
    if (statusEl) statusEl.innerHTML = `<span style="color:var(--danger)">❌ ${e.message}</span>`
  }
}

  const REASON_LABELS = {
    spam:'Spam / Quảng cáo', harassment:'Quấy rối / Xúc phạm',
    hate_speech:'Ngôn từ thù hận', misinformation:'Thông tin sai lệch',
    off_topic:'Không liên quan', other:'Khác',
  }
  const STATUS_BADGE = {
    pending:   '<span class="badge badge-noreport">⏳ Chờ xử lý</span>',
    reviewed:  '<span class="badge badge-stable">✅ Đã xử lý</span>',
    dismissed: '<span class="badge badge-deact">🚫 Bỏ qua</span>',
  }

  try {
    const d = await api(`/forum/content-reports?page=${s.reportPage}&limit=15&status=${s.reportStatus}&type=${s.reportType}`)
    forumModState.reportTotal = d.total
    const countEl = document.getElementById('fm-reports-count')
    if (countEl) countEl.textContent = `${d.total} báo cáo`
    if (!d.reports || d.reports.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="8">Không có báo cáo nào</td></tr>'
    } else {
      tbody.innerHTML = d.reports.map(r => {
        const typeBadge = r.target_type === 'post'
          ? '<span class="badge badge-sub">📝 Bài viết</span>'
          : '<span class="badge badge-user">💬 Bình luận</span>'
        const previewShort = String(r.preview||'').substring(0,65) + (String(r.preview||'').length > 65 ? '…' : '')
        const reasonLabel = REASON_LABELS[r.reason] || r.reason
        const statusHtml  = STATUS_BADGE[r.status] || `<span class="badge">${r.status}</span>`
        const actionBtns  = r.status === 'pending' ? `
          <div style="display:flex;gap:5px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" onclick="fmRepDetail(${r.id})" title="Xem chi tiết">👁</button>

          </div>` : `<button class="btn btn-ghost btn-sm" onclick="fmRepDetail(${r.id})">👁 Xem</button>`

        // store report data for detail modal
        window['_frep_'+r.id] = r

        return `<tr>
          <td style="color:var(--muted);font-size:11px">#${r.id}</td>
          <td>${typeBadge}</td>
          <td style="max-width:200px;font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escAttr(r.preview)}">${previewShort}</td>
          <td style="font-size:12px;color:var(--warn);white-space:nowrap">${reasonLabel}</td>
          <td class="email-cell" style="font-size:12px" title="${r.reporter_email}">${r.reporter_email}</td>
          <td>${statusHtml}</td>
          <td style="font-size:11px;color:var(--muted);white-space:nowrap">${fmtDate(r.created_at)}</td>
          <td>${actionBtns}</td>
        </tr>`
      }).join('')
    }
    renderPagination('fm-reports-pagination', s.reportPage, d.total_pages, p=>{forumModState.reportPage=p;loadFmReports()})
  } catch(e) { toast(e.message,'error') }
}

function fmRepDetail(id) {
  const r = window['_frep_'+id]
  if (!r) return
  const REASON_LABELS = {
    spam:'Spam / Quảng cáo', harassment:'Quấy rối / Xúc phạm',
    hate_speech:'Ngôn từ thù hận', misinformation:'Thông tin sai lệch',
    off_topic:'Không liên quan', other:'Khác',
  }
  document.getElementById('detail-title').textContent = `🚩 Báo cáo #${r.id}`
  document.getElementById('detail-body').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="detail-row"><span class="detail-key">Loại nội dung:</span><span class="detail-val">${r.target_type === 'post' ? '📝 Bài viết' : '💬 Bình luận'} #${r.target_id}</span></div>
      <div class="detail-row"><span class="detail-key">Người báo cáo:</span><span class="detail-val">${r.reporter_email}</span></div>
      <div class="detail-row"><span class="detail-key">Lý do:</span><span class="detail-val" style="color:var(--warn)">${REASON_LABELS[r.reason]||r.reason}</span></div>
      ${r.note ? `<div class="detail-row"><span class="detail-key">Ghi chú:</span><span class="detail-val" style="white-space:pre-wrap">${r.note}</span></div>` : ''}
      <div class="detail-row"><span class="detail-key">Trạng thái:</span><span class="detail-val">${r.status}</span></div>
      ${r.admin_note ? `<div class="detail-row"><span class="detail-key">Ghi chú admin:</span><span class="detail-val">${r.admin_note}</span></div>` : ''}
      <div style="background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:12px">
        <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase">Nội dung bị báo cáo</div>
        <div style="font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap">${escAttr(r.preview)}</div>
      </div>
      ${r.status === 'pending' ? `
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
          <textarea id="rep-admin-note" placeholder="Ghi chú nội bộ (không bắt buộc)..." rows="2"
            class="form-input" style="resize:vertical;font-size:12px"></textarea>
          <div style="display:flex;gap:8px">
            <button class="btn btn-danger" onclick="fmDeleteTarget(${r.id},'${r.target_type}',${r.target_id},true)">🗑 Xóa nội dung vi phạm</button>
            <button class="btn btn-ghost"  onclick="fmDismissReport(${r.id},true)">🚫 Bỏ qua báo cáo</button>
          </div>
        </div>
      ` : ''}
    </div>
  `
  document.getElementById('detail-modal').style.display = 'flex'
}

function fmDismissReport(id, fromDetail=false) {
  const adminNote = fromDetail ? (document.getElementById('rep-admin-note')?.value || '') : ''
  openConfirm('Bỏ qua báo cáo', `Đánh dấu báo cáo #${id} là "không vi phạm" và bỏ qua?`, async () => {
    try {
      await api(`/forum/content-reports/${id}`, { method:'PATCH', body: JSON.stringify({ status:'dismissed', admin_note: adminNote }) })
      toast('🚫 Đã bỏ qua báo cáo', 'success')
      if (fromDetail) document.getElementById('detail-modal').style.display = 'none'
      loadFmStats(); loadFmReports()
    } catch(e) { toast(e.message,'error') }
  }, false, 'btn-ghost')
}

function fmDeleteTarget(reportId, targetType, targetId, fromDetail=false) {
  openConfirm(
    'Xóa nội dung vi phạm',
    `Xóa vĩnh viễn ${targetType === 'post' ? 'bài viết' : 'bình luận'} #${targetId}? Hành động này không thể hoàn tác.`,
    async () => {
      try {
        await api(`/forum/content-reports/${reportId}/target`, { method:'DELETE' })
        toast('🗑 Đã xóa nội dung vi phạm', 'success')
        if (fromDetail) document.getElementById('detail-modal').style.display = 'none'
        loadFmStats(); loadFmReports()
      } catch(e) { toast(e.message,'error') }
    }, false, 'btn-danger'
  )
}

async function loadFmPending() {
  const page = forumModState.pendingPage
  const tbody = document.getElementById('fm-pending-tbody')
  if (!tbody) return
  tbody.innerHTML = '<tr class="loading-row"><td colspan="7"><span class="spinner"></span></td></tr>'
  try {
    const d = await api(`/forum/pending?page=${page}&limit=15`)
    forumModState.pendingTotal = d.total
    const countEl = document.getElementById('fm-pending-count')
    if (countEl) countEl.textContent = `${d.total} bài chờ duyệt`
    if (!d.posts || d.posts.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="7" style="text-align:center;padding:32px;color:var(--muted)">🎉 Không có bài viết nào đang chờ duyệt</td></tr>'
    } else {
      tbody.innerHTML = d.posts.map(p => {
        const tagHtml = (p.tags||[]).map(t =>
          `<span style="font-size:10px;padding:1px 6px;border-radius:10px;background:${t.color}22;color:${t.color};border:1px solid ${t.color}44;white-space:nowrap">${t.icon} ${t.label}</span>`
        ).join(' ')
        const reason = p.ai_moderation_reason
          ? `<span title="${p.ai_moderation_reason}" style="color:var(--warn);font-size:11px;cursor:help">${String(p.ai_moderation_reason).substring(0,40)}${p.ai_moderation_reason.length>40?'…':''}</span>`
          : '<span style="color:var(--muted)">–</span>'
        const titleShort = String(p.title).substring(0,55) + (p.title.length>55?'…':'')
        return `<tr>
          <td style="color:var(--muted);font-size:11px">#${p.id}</td>
          <td style="max-width:200px">
            <div style="font-weight:600;font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.title}">${titleShort}</div>
          </td>
          <td class="email-cell" title="${p.author_email}" style="font-size:12px">${p.author_email}</td>
          <td style="min-width:90px">${tagHtml || '<span style="color:var(--muted)">–</span>'}</td>
          <td style="max-width:160px">${reason}</td>
          <td style="white-space:nowrap;font-size:11px;color:var(--muted)">${fmtDateTime(p.created_at)}</td>
          <td style="white-space:nowrap">
            <div style="display:flex;gap:6px">
              <button class="btn btn-ghost btn-sm" onclick="fmPreviewPost(${p.id},'${escAttr(p.title)}','${escAttr(p.content)}','${p.author_email}')">👁 Xem</button>
              <button class="btn btn-success btn-sm" onclick="fmApprove(${p.id})">✅ Duyệt</button>
              <button class="btn btn-danger btn-sm" onclick="fmDelete(${p.id},'pending')">🗑 Xóa</button>
            </div>
          </td>
        </tr>`
      }).join('')
    }
    renderPagination('fm-pending-pagination', page, d.total_pages, p=>{forumModState.pendingPage=p;loadFmPending()})
  } catch(e) { toast(e.message,'error') }
}

async function loadFmApproved() {
  const page = forumModState.approvedPage
  const search = forumModState.approvedSearch
  const tbody = document.getElementById('fm-approved-tbody')
  if (!tbody) return
  tbody.innerHTML = '<tr class="loading-row"><td colspan="8"><span class="spinner"></span></td></tr>'
  try {
    const d = await api(`/forum/approved?page=${page}&limit=15&search=${encodeURIComponent(search)}`)
    forumModState.approvedTotal = d.total
    const countEl = document.getElementById('fm-approved-count')
    if (countEl) countEl.textContent = `${d.total} bài đã duyệt`
    if (!d.posts || d.posts.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="8">Không có bài viết nào</td></tr>'
    } else {
      tbody.innerHTML = d.posts.map(p => {
        const tagHtml = (p.tags||[]).map(t =>
          `<span style="font-size:10px;padding:1px 6px;border-radius:10px;background:${t.color}22;color:${t.color};border:1px solid ${t.color}44;white-space:nowrap">${t.icon} ${t.label}</span>`
        ).join(' ')
        const titleShort = String(p.title).substring(0,50) + (p.title.length>50?'…':'')
        return `<tr>
          <td style="color:var(--muted);font-size:11px">#${p.id}</td>
          <td style="max-width:190px">
            <div style="font-weight:600;font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${p.title}">${titleShort}</div>
          </td>
          <td class="email-cell" title="${p.author_email}" style="font-size:12px">${p.author_email}</td>
          <td style="min-width:80px">${tagHtml || '<span style="color:var(--muted)">–</span>'}</td>
          <td style="text-align:center;font-size:12px">${p.like_count||0}</td>
          <td style="text-align:center;font-size:12px">${p.comment_count||0}</td>
          <td style="white-space:nowrap;font-size:11px;color:var(--muted)">${fmtDate(p.created_at)}</td>
          <td>
            <div style="display:flex;gap:6px">
              <button class="btn btn-ghost btn-sm" onclick="fmPreviewPost(${p.id},'${escAttr(p.title)}','${escAttr(p.content)}','${p.author_email}')">👁 Xem</button>
              <button class="btn btn-danger btn-sm" onclick="fmDelete(${p.id},'approved')">🗑 Xóa</button>
            </div>
          </td>
        </tr>`
      }).join('')
    }
    renderPagination('fm-approved-pagination', page, d.total_pages, p=>{forumModState.approvedPage=p;loadFmApproved()})
  } catch(e) { toast(e.message,'error') }
}

function escAttr(s) {
  return String(s||'').replace(/'/g,"\\'").replace(/\n/g,'\\n').substring(0,500)
}

function fmPreviewPost(id, title, content, email) {
  document.getElementById('detail-title').textContent = `📄 Bài viết #${id}`
  document.getElementById('detail-body').innerHTML = `
    <div style="margin-bottom:12px">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px">Tác giả</div>
      <div style="font-size:13px;color:var(--text)">${email}</div>
    </div>
    <div style="margin-bottom:12px">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px">Tiêu đề</div>
      <div style="font-size:15px;font-weight:700;color:var(--text)">${title}</div>
    </div>
    <div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Nội dung</div>
      <div style="font-size:13px;color:var(--text);line-height:1.7;white-space:pre-wrap;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:12px 14px;max-height:400px;overflow-y:auto">${content}</div>
    </div>
  `
  document.getElementById('detail-modal').style.display = 'flex'
}

function fmApprove(id) {
  openConfirm('Duyệt bài viết', `Duyệt và đăng công khai bài viết #${id}?`, async () => {
    try {
      await api(`/forum/posts/${id}/approve`, { method: 'POST', body: JSON.stringify({}) })
      toast('✅ Đã duyệt bài viết', 'success')
      loadFmStats()
      loadFmPending()
    } catch(e) { toast(e.message, 'error') }
  }, false, 'btn-success')
}

function fmDelete(id, fromTab) {
  openConfirm('Xóa bài viết', `Xóa vĩnh viễn bài viết #${id}? Hành động này không thể hoàn tác.`, async () => {
    try {
      await api(`/forum/posts/${id}`, { method: 'DELETE' })
      toast('🗑 Đã xóa bài viết', 'success')
      loadFmStats()
      if (fromTab === 'pending') loadFmPending()
      else loadFmApproved()
    } catch(e) { toast(e.message, 'error') }
  }, false, 'btn-danger')
}

// Load pending count on init for sidebar badge
async function loadFmSidebarBadge() {
  try {
    const d = await api('/forum/stats')
    const badge = document.getElementById('sb-pending-badge')
    // Show combined count: pending posts + pending reports
    const total = (d.pending || 0) + (d.pending_reports || 0)
    if (badge) {
      badge.textContent = total
      badge.style.display = total > 0 ? 'inline' : 'none'
    }
  } catch { /* silent */ }
}

// ═══════════════════════════════════════════════════════════════════════════════
// PAGINATION HELPER
// ═══════════════════════════════════════════════════════════════════════════════
function renderPagination(containerId, page, totalPages, cb) {
  const el = document.getElementById(containerId)
  if (!el) return
  if (totalPages <= 1) { el.innerHTML=''; return }
  el.innerHTML = `
    <button class="pg-btn" ${page<=1?'disabled':''} onclick="(${cb.toString()})(${page-1})">‹ Trước</button>
    <span class="pg-info">Trang ${page} / ${totalPages}</span>
    <button class="pg-btn" ${page>=totalPages?'disabled':''} onclick="(${cb.toString()})(${page+1})">Sau ›</button>
  `
}

// ═══════════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════════
;(async function init() {
  if (TOKEN && ADMIN && ['rootadmin','subadmin'].includes(ADMIN.role)) {
    try {
      await api('/me')  // verify token still valid
      initApp()
      // Load pending badge after a short delay
      setTimeout(loadFmSidebarBadge, 800)
    } catch {
      doLogout()
    }
  }
})()
</script>
</body>
</html>
